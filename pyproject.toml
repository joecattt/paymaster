[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paymaster"
version = "0.5.0"
description = "Reference implementation for verifiable agent-spend receipts"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.6,<2"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
